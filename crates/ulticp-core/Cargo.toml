[package]
name = "ulticp-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
regex = "1.10"
uuid = { version = "1.10", features = ["v4", "serde"] }
thiserror = "1.0"
once_cell = "1.19"
base64 = "0.22"

